    <meta name="description" content="Need skincare advice? Fill out our enquiry form and our experts at GlowLab Beauty will help you.">
    <meta name="keywords" content="skincare advice, skin consultation, GlowLab enquiry">
    <title>GlowLab Beauty | Skincare Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">
                <img src="images/logo-placeholder.png" alt="GlowLab Beauty logo" width="150">
            </a>
        </div>
        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="products.html">Products</a> |
            <a href="enquiry.html">Enquiry</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Skincare Enquiry</h1>
        <p>Not sure which product is right for you? Fill in the form below.</p>

        <section class="enquiry-form-section">
            <!-- The id is used by my JavaScript to check the form -->
            <form id="enquiryForm" action="#" method="post">
                
                <div class="form-group">
                    <label for="fullname">Your Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="e.g. Jane Doe">
                </div>

                <div class="form-group">
                    <label for="email">Your Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="jane@example.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="082 123 4567">
                </div>

                <div class="form-group">
                    <label for="skintype">Your Skin Type:</label>
                    <select id="skintype" name="skintype">
                        <option value="">-- Please Select --</option>
                        <option value="oily">Oily</option>
                        <option value="dry">Dry</option>
                        <option value="combination">Combination</option>
                        <option value="sensitive">Sensitive</option>
                        <option value="normal">Normal</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Question:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tell us what you're looking for..."></textarea>
                </div>

                <button type="submit">Send Enquiry</button>
                <button type="reset">Clear</button>
            </form>
            
            <!-- This is where my JavaScript will show the custom message after they submit -->
            <div id="enquiry-response" style="display:none; margin-top: 20px; padding: 15px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 5px;"></div>
        </section>
    </main>
